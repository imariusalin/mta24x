services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mta}
      POSTGRES_DB: mta
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mta"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  engine:
    build: .
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://mta:${POSTGRES_PASSWORD:-mta}@127.0.0.1:5432/mta
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD:-changeme}"
    volumes:
      - ./data/stalwart:/opt/stalwart
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    environment:
      JMAP_SERVER_URL: http://stalwart:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
    depends_on:
      - stalwart
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - webmail
    restart: unless-stopped
