services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mta}
      POSTGRES_DB: mta
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mta"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  engine:
    build: .
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://mta:${POSTGRES_PASSWORD:-mta}@127.0.0.1:5432/mta
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n >/dev/tcp/127.0.0.1/8787'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD:-changeme}"
    volumes:
      - ./data/stalwart:/opt/stalwart
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      JMAP_SERVER_URL: http://stalwart:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
    volumes:
      - ./data/webmail-admin:/app/data/admin
      - ./data/webmail-state:/app/data/admin-state
    depends_on:
      - stalwart
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # Same host net as the engine so /console hits 127.0.0.1:8787. Bridge
    # Caddy → host.docker.internal:8787 is a UFW 502 on Ubuntu.
    network_mode: host
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - webmail
    restart: unless-stopped
