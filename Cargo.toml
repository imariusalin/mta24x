[package]
name = "mta"
version = "0.1.0"
edition = "2021"
description = "Company outbound MTA with IP/domain warming, virtual pools, and a transactional API. Stalwart handles IMAP."

[dependencies]
anyhow = "1"
dotenvy = "0.15"
axum = { version = "0.8", features = ["json", "macros", "form"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
hickory-resolver = { version = "0.25", features = ["tokio"] }
hex = "0.4"
hmac = "0.12"
mail-auth = "0.7"
mail-parser = "0.11"
mail-send = { version = "0.5", features = ["builder", "dkim"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
